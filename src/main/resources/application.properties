server.port=8080
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# API keys — set via environment variables (never commit real keys)
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
huggingface.api.key=${HUGGINGFACE_API_KEY:}
huggingface.api.url=${HUGGINGFACE_API_URL:https://api-inference.huggingface.co/models/facebook/detr-resnet-50}

# Actuator health/metrics for readiness and observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=thumbnail-generator
